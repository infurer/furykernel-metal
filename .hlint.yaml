#
# The language of furykernel-metal.cabal's common stanza, which hlint doesn't
# read: without it, record dot syntax parses as composition.
- arguments:
    - -XGHC2024
    - -XOverloadedRecordDot
    - -XOverloadedStrings
    - -XStrictData
    - -XTypeFamilies
